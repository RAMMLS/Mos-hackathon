name: ITERATION_001 source publication and tests

on:
  push:
    branches: [chatgpt/iteration-001]
    paths:
      - 'maintenance/iteration001/**'
      - '.github/workflows/iteration001.yml'
      - 'src/**'
      - 'scripts/**'
      - 'local_iteration/**'
      - 'pom.xml'
  workflow_dispatch:

concurrency:
  group: iteration001-publication
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish-and-test:
    if: github.repository == 'RAMMLS/Mos-hackathon' && github.ref == 'refs/heads/chatgpt/iteration-001'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout iteration branch only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/iteration-001
          fetch-depth: 1
          persist-credentials: true
      - name: Verify preimages and materialize reviewed source changes
        run: python3 maintenance/iteration001/apply_iteration.py
      - name: Commit only allowlisted changes to the iteration branch
        env:
          TARGET_BRANCH: chatgpt/iteration-001
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'RAMMLS/Mos-hackathon'
          assert os.environ['GITHUB_REF'] == 'refs/heads/chatgpt/iteration-001'
          manifest=json.loads(Path('maintenance/iteration001/manifest.json').read_text())
          files=[f['path'] for f in manifest['files']]+['maintenance/iteration001/APPLIED.json']
          # Force only this explicit allowlist: its synthetic result.geojson is intentionally tracked.
          subprocess.run(['git','add','-f','--',*files],check=True)
          diff=subprocess.run(['git','diff','--cached','--quiet'])
          if diff.returncode not in (0,1): raise SystemExit(diff.returncode)
          if diff.returncode == 1:
              subprocess.run(['git','-c','user.name=github-actions[bot]',
                              '-c','user.email=41898282+github-actions[bot]@users.noreply.github.com',
                              'commit','-m','Apply ITERATION_001 source fixes, regression tests and local runner'],check=True)
              subprocess.run(['git','push','origin','HEAD:refs/heads/chatgpt/iteration-001'],check=True)
          else:
              print('No new source changes to publish.')
          PY
      - name: Set up Java 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: python -m pip install -r local_iteration/requirements-qa.txt
      - name: Run runner, checker and numeric Java-kernel regression tests
        run: |
          mkdir -p iteration_logs/ci
          git rev-parse HEAD | tee iteration_logs/ci/source-commit.txt
          python -m unittest discover -s local_iteration -p test_qa_runner.py -v 2>&1 | tee iteration_logs/ci/runner-tests.log
          python -m unittest discover -s scripts -p test_certification_roots.py -v 2>&1 | tee iteration_logs/ci/checker-tests.log
          python -m unittest discover -s scripts -p test_entry_interval_kernel.py -v 2>&1 | tee iteration_logs/ci/numeric-tests.log
          python scripts/benchmark_smoke_tests.py 2>&1 | tee iteration_logs/ci/checker-smoke.log
      - name: Build and test the complete Java application
        env:
          MAVEN_OPTS: -Xmx2g -Dfile.encoding=UTF-8
        run: |
          timeout 480s mvn -B -ntp clean package -DskipTests=false -Dmaven.test.skip=false 2>&1 | tee iteration_logs/ci/maven.log
      - name: Save CI logs even if a test failed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ITERATION_001_CI_${{ github.run_id }}
          path: |
            iteration_logs/ci/
            target/surefire-reports/
            maintenance/iteration001/APPLIED.json
          retention-days: 7
          if-no-files-found: warn
