services:
  heat-network-router:
    build: .
    environment:
      VISUALIZATION_DATA_ROOT: /app/data/real_geojson_places
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx12g -XX:+UseG1GC
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro
      - heat-network-tmp:/tmp

volumes:
  heat-network-tmp:
